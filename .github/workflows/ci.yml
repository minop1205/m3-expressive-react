name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Storybook 10 / Vite 8 require Node >= 22.12
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:tokens
      - run: npm test
      - run: npm run build
      # dist keeps "use client" on client modules; RSC import works (#409)
      - run: npm run check:rsc

  # Visual regression testing moved from Chromatic to the self-hosted
  # Playwright suite — see .github/workflows/vrt.yml (issue #112).
