name: Close linked issues

# GitHub only auto-closes "Closes #N" references when a PR merges into the
# DEFAULT branch (main). Our PRs merge into develop, so this workflow replays
# that behavior: on merge into develop, parse the PR body for closing keywords
# and close the referenced issues.
on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const body = pr.body || ''
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi
            const nums = [...new Set([...body.matchAll(re)].map((m) => Number(m[1])))]
            if (nums.length === 0) return
            for (const issue_number of nums) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number })
                if (issue.pull_request || issue.state === 'closed') continue
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `Closed by #${pr.number} (merged into \`develop\`).`,
                })
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                })
                core.info(`Closed #${issue_number}`)
              } catch (e) {
                core.warning(`Could not close #${issue_number}: ${e.message}`)
              }
            }
